# @package _global_
optimizer:
  lr: 0.0012
  weight_decay: 0.0
  warmup_steps: 300
training:
  max_steps: 10000
  val_every_n_steps: 100
  grad_clip_norm: 5.0
  validation_pairs: 20000
  generation_pairs: 1024
early_stopping:
  patience: 15
  min_delta_perc: 0.005
inference:
  validation_samples: 100
  evaluation_samples: 100
  generation_rows_upper_bound: 10240
