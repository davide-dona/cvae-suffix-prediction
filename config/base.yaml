seed: 42
experiment_name: cvae_suffix_baseline
output_dir: outputs

model:
  embeddings:
    activity_dim: 64
    resource_dim: 32

  prefix_encoder:
    hidden_dim: 128
    num_layers: 2
    dropout: 0.1

  suffix_encoder:
    hidden_dim: 128
    num_layers: 1
    dropout: 0.1

  prior:
    hidden_dims: [128]
    dropout: 0.1

  latent:
    latent_dim: 32

  attention:
    dim: 128
    dropout: 0.1

  decoder:
    hidden_dim: 128
    num_layers: 2
    dropout: 0.1
    head_hidden_dim: 128

loss:
  kl_annealing_cycles: 4
  kl_annealing_ratio: 0.5
  kl_annealing_start_weight: 0.0
  kl_annealing_full_weight: 1.0

optimizer:
  lr: 0.001
  weight_decay: 0.0001

training:
  max_num_epochs: 100
  grad_clip_norm: 5.0
  device: cpu
  checkpoint_dir: outputs/checkpoints
  log_dir: outputs/tensorboard
  val_every_n_epochs: 1

early_stopping:
  patience: 10
  min_delta_perc: 0.0
