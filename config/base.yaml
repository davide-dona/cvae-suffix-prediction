seed: 42
experiment_name: cvae_suffix_transformer
output_dir: outputs

model:
  # The size of the embedding space
  d_model: 64

  # Activity/resource lookup widths, concatenated with the time delta, the data section's
  # event_features and their present flags, and projected to d_model.
  embeddings:
    activity_dim: 16
    resource_dim: 16
    feature_dim: 8  # per categorical event feature; each one widens the projection's input

  # Encodes the prefix; its CLS summary feeds both the prior and the decoder's cross-attention.
  prefix_encoder:
    num_layers: 2
    num_heads: 4
    feedforward_dim: 256
    dropout: 0.1

  # Encodes the ground-truth suffix for the posterior, training only; shallower on purpose.
  suffix_encoder:
    num_layers: 1
    num_heads: 4
    feedforward_dim: 256
    dropout: 0.1

  # MLP mapping the prefix summary to p(z|prefix), sampled from at inference.
  prior:
    hidden_dims: [64]  # (empty for a linear prior)
    dropout: 0.1

  latent:
    latent_dim: 16  # z only carries what the prefix leaves undetermined

  # Causal self-attention over the suffix, cross-attention over the encoded prefix.
  decoder:
    num_layers: 2
    num_heads: 4
    feedforward_dim: 256
    dropout: 0.1
    activity_dropout: 0.3  # teacher-forced activities blanked in training, so the decoder must lean on z
    head_hidden_dim: 64

# All the hyperparameters below are defined in steps, not epochs, 
# so that they are independent of the dataset size and batch size.
loss:
  # KL annealing: for each period, the KL term is ramped up from 0 to full weight over a fraction of the period, 
  # then kept at full weight until the end of the period. This helps prevent posterior collapse early in training.
  kl_annealing_period_steps: 10000
  kl_annealing_ratio: 0.3   # fraction of the period spent ramping up from 0 to full weight
  kl_annealing_start_weight: 0.0
  kl_annealing_full_weight: 0.5  # below 1 keeps deviating from the prior cheaper than losing reconstruction
  free_bits: 0.3  # nats/dimension floor below which the KL is not penalized; keeps z from collapsing

optimizer:
  lr: 0.0003
  weight_decay: 0.0

training:
  max_steps: 30000 
  grad_clip_norm: 5.0  # null to leave gradients unclipped
  device: mps  # Apple-silicon GPU; ['cpu', 'cuda', 'mps']
  best_model_dir: outputs/best-models  # one file per run, overwritten on improvement
  checkpoint_dir: outputs/checkpoints  # last validated step, what --resume reads
  log_dir: outputs/tensorboard
  val_every_n_steps: 400
  # Fixed slice of the evaluation set used for validation;
  # Using the full evaluation set for validation would be too slow
  validation_pairs: 20000
  generation_pairs: 1024

early_stopping:
  patience: 30   # number of validation checks with no improvement after which training will be stopped
  min_delta_perc: 0.005  # z is sampled, so the score is noisy; this is the margin that counts as progress

inference:
  # k suffixes per prefix differ only in z ~ p(z|prefix); heads are read greedily.
  # At least ten, since hit_rate_at_10 reads the tenth draw.
  num_samples: 10
  
  # Caps decoder memory usage per batch. The decoder receives
  # num_samples * min(batch_size, upper_bound) rows at once; this bounds
  # that total regardless of num_samples, which is set independently.
  generation_rows: 2560
  generations_dir: outputs/generations

