seed: 42
experiment_name: cvae_suffix_baseline
output_dir: outputs

model:
  embeddings:
    activity_dim: 32
    resource_dim: 16

  prefix_encoder:
    hidden_dim: 200  # per direction: the summary is twice this wide
    num_layers: 1
    dropout: 0.05

  suffix_encoder:
    hidden_dim: 200
    num_layers: 1
    dropout: 0.05

  prior:
    hidden_dims: [200]  # empty for a linear prior
    dropout: 0.05

  latent:
    latent_dim: 32

  attention:
    dim: 200
    dropout: 0.05

  decoder:
    hidden_dim: 200
    num_layers: 1
    dropout: 0.05
    head_hidden_dim: 100

loss:
  # Cyclical weight ramp over training steps, held at full weight between ramps.
  kl_annealing_cycles: 5
  kl_annealing_ratio: 0.3
  kl_annealing_start_weight: 0.0
  kl_annealing_full_weight: 1.0
  free_bits: 0.15  # nats/dimension floor below which KL is not penalized; keeps z from collapsing

optimizer:
  lr: 0.0003
  weight_decay: 0.0

training:
  max_steps: 100000
  grad_clip_norm: 5.0  # null to leave gradients unclipped
  device: mps  # Apple-silicon GPU; ['cpu', 'cuda', 'mps']
  best_model_dir: outputs/best-models  # one file per run, overwritten on improvement
  log_dir: outputs/tensorboard
  val_every_n_steps: 400

inference:
  # k suffixes per prefix differ only in z ~ p(z|prefix); heads are read greedily.
  num_samples: 10
  predictions_dir: outputs/predictions

early_stopping:
  patience: 20   # number of validation checks with no improvement after which training will be stopped
  min_delta_perc: 0.005  # z is sampled, so that loss is noisy; keeps a plateau from resetting it
