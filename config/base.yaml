seed: 42
experiment_name: cvae_suffix_transformer
output_dir: outputs

# Denominated in optimizer steps, not epochs, so one value holds for every log; a dataset file
# then needs nothing but its `data:` section.
model:
  # The size of the embedding space
  d_model: 64

  # Activity/resource lookup widths, concatenated with the time delta and projected to d_model.
  embeddings:
    activity_dim: 16
    resource_dim: 16

  # Encodes the prefix; its CLS summary feeds both the prior and the decoder's cross-attention.
  prefix_encoder:
    num_layers: 2
    num_heads: 4
    feedforward_dim: 256
    dropout: 0.1

  # Encodes the ground-truth suffix for the posterior, training only; shallower on purpose.
  suffix_encoder:
    num_layers: 1
    num_heads: 4
    feedforward_dim: 256
    dropout: 0.1

  # MLP mapping the prefix summary to p(z|prefix), sampled from at inference.
  prior:
    hidden_dims: [64]  # empty for a linear prior
    dropout: 0.1

  latent:
    latent_dim: 16  # z only carries what the prefix leaves undetermined

  # Causal self-attention over the suffix, cross-attention over the encoded prefix.
  decoder:
    num_layers: 2
    num_heads: 4
    feedforward_dim: 256
    dropout: 0.1
    head_hidden_dim: 64

loss:
  # Cyclical weight ramp over training steps, held at full weight between ramps. The period is
  # a length, not a fraction of max_steps, so changing the budget leaves the schedule alone.
  kl_annealing_period_steps: 10000  # 3000-step ramp, then 7000 held at full weight
  kl_annealing_ratio: 0.3
  kl_annealing_start_weight: 0.0
  kl_annealing_full_weight: 1.0
  free_bits: 0.15  # nats/dimension floor below which KL is not penalized; keeps z from collapsing

optimizer:
  lr: 0.0003
  weight_decay: 0.0

training:
  max_steps: 30000  # three whole annealing cycles; ~7h on bpic-2017, the longest log here
  grad_clip_norm: 5.0  # null to leave gradients unclipped
  device: mps  # Apple-silicon GPU; ['cpu', 'cuda', 'mps']
  best_model_dir: outputs/best-models  # one file per run, overwritten on improvement
  log_dir: outputs/tensorboard
  val_every_n_steps: 400 

early_stopping:
  patience: 30   # validations with no improvement after which training stops; must outlast one ramp
  min_delta_perc: 0.005  # z is sampled, so the score is noisy; this is the margin that counts as progress

inference:
  # k suffixes per prefix differ only in z ~ p(z|prefix); heads are read greedily.
  num_samples: 10
  predictions_dir: outputs/predictions

evaluation:
  metrics_dir: outputs/evaluation

