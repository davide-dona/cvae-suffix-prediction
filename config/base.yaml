seed: 42
experiment_name: cvae_suffix_baseline
output_dir: outputs

model:
  embeddings:
    activity_dim: 32
    resource_dim: 16

  prefix_encoder:
    hidden_dim: 200  # per direction: the summary is twice this wide
    num_layers: 1
    dropout: 0.05

  suffix_encoder:
    hidden_dim: 200
    num_layers: 1
    dropout: 0.05

  prior:
    hidden_dims: [200]  # empty for a linear prior
    dropout: 0.05

  latent:
    latent_dim: 32

  attention:
    dim: 200
    dropout: 0.05

  decoder:
    hidden_dim: 200
    num_layers: 1
    dropout: 0.05
    head_hidden_dim: 100

loss:
  kl_annealing_cycles: 8
  kl_annealing_ratio: 0.5
  kl_annealing_start_weight: 0.0
  kl_annealing_full_weight: 1.0

optimizer:
  lr: 0.0003
  weight_decay: 0.0

training:
  # An epoch is one pass over every (prefix, suffix) pair of the split, so a dataset of few
  # long traces needs far fewer epochs than its trace count suggests. Each dataset overrides
  # this with a budget of its own.
  max_num_epochs: 1000
  grad_clip_norm: 5.0  # null to leave gradients unclipped
  # "mps" is the Apple-silicon GPU. It beats "cpu" here, but only because the per-step decoder
  # is launch-bound rather than compute-bound: the margin grows with the batch size, so a
  # smaller batch than this one narrows it. A dataset file overrides this with "cuda" or "cpu".
  device: mps
  # A run's best epoch is kept under `best_model_dir` as the single file `<run name>.pt`,
  # overwritten every time the validation loss improves.
  best_model_dir: outputs/best-models
  log_dir: outputs/tensorboard
  val_every_n_epochs: 1

inference:
  # Every sample of a prefix is a row of its own in the decoder, so the batch it actually runs
  # is `data.batch_size * num_samples`. The k suffixes of one prefix differ only in the latent
  # drawn from p(z | prefix): the heads are read greedily, so what varies across them is what
  # the model claims the prefix leaves undetermined.
  num_samples: 10
  predictions_dir: outputs/predictions

early_stopping:
  # The counter only runs while the KL weight is at its full value and resets when it drops,
  # so patience has to stay below the length of one full-weight stretch: with 8 cycles at
  # ratio 0.5 that is `max_num_epochs / 16`.
  patience: 50
  min_delta_perc: 0.0
