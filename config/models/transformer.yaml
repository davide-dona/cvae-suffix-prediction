# The same backbone with the latent path taken out: the arm the CVAE is read against. Every width
# below matches config/models/cvae.yaml, so what separates the two runs is the latent and nothing
# else. With no z conditioning the decoder, the draws have to come from the activity head instead,
# sampled from its logits at every step. That per-step noise is exactly what the latent exists to
# avoid, which is the comparison.
#
# Both time heads are point regressors, as the CVAE's are and as SuTraN's are, rather than heads
# emitting a scale of their own to be drawn from.
seed: 42

dataloader:
  batch_size: 4096
  # 48 vCPUs, so cores are not the constraint: each worker prefetches two of these batches,
  # and a batch of 4096 padded prefix/suffix pairs is hundreds of MB of host memory.
  num_workers: 12

model:
  kind: transformer
  name: transformer

  d_model: 32

  embeddings:
    activity_dim: 16
    resource_dim: 32
    feature_dim: 8

  # Reads the prefix alone: with no posterior there is nothing a summary of the suffix would feed.
  encoder:
    num_layers: 4
    num_heads: 8
    feedforward_dim: 128
    dropout: 0.1

  decoder:
    num_layers: 4
    num_heads: 8
    feedforward_dim: 128
    dropout: 0.1
    activity_dropout: 0.3
    head_hidden_dim: 128

  # How the activity logits are shaped before a draw reads them, inference-time only.
  # `pipelines.tune` searches the pair of sampling parameters on the validation split 
  # once a run is trained, and what it picks is written back here and handed to `pipelines.generate`.
  sampling:
    # Divides the logits. Above 1 flattens every step alike, below 1 sharpens them. 
    temperature: 1.0
    # Keeps the smallest set of activities summing to this.
    top_p: 1.0

optimizer:
  lr: 0.0012
  weight_decay: 0.0
  warmup_steps: 300

training:
  device: cuda:0
  max_steps: 10000
  val_every_n_steps: 100
  grad_clip_norm: 5.0  # null to leave gradients unclipped
  # Fixed slice of the evaluation set used for validation;
  # Using the full evaluation set for validation would be too slow
  validation_pairs: 20000
  generation_pairs: 1024

early_stopping:
  # Non-improving validation checks tolerated before training stops.
  patience: 15
  min_delta_perc: 0.005

# Suffixes drawn per prefix, once for each of the two passes that generate them.
inference:
  # The pass inside the training loop, over a fixed slice of the validation split. A checkpoint is
  # selected on it, so it is read at the budget the report it is answering for is read at.
  validation_samples: 100
  # The pass over the whole test split that a report is built from. Paid for once per run.
  evaluation_samples: 100
  generation_rows_upper_bound: 10240
