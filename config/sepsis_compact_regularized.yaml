# Sepsis, compact and regularized.
#
# The baseline (`sepsis.yaml`) overfits from around epoch 30: train reconstruction loss keeps
# falling while val reconstruction loss turns back up, and by epoch 59 the two have moved
# 9.22 against 15.06. Reconstruction is the term to read, since it carries no KL weight and
# is therefore comparable across a run whose weight is still annealing.
#
# The cause is the size of the log rather than the architecture: 508 train cases, 8891
# events, 16 activities and 25 resources, against encoders and a decoder 200 wide with
# dropout at 0.05 and no weight decay. So the architecture is unchanged and every knob below
# either takes capacity away or puts noise back in. `data:` is copied verbatim from
# `sepsis.yaml`, because `load_config` merges exactly one dataset file over `base.yaml`, and
# it points at the same `data/sepsis` splits, so runs of both land in one TensorBoard folder
# and are directly comparable.
experiment_name: compact_regularized

data:
  dir: data/sepsis

  case_key: "Case ID"
  activity_key: Activity
  resource_key: Resource
  timestamp_key: "time:timestamp"
  label_key: label

  train_split: 0.65
  val_split: 0.15
  test_split: 0.2
  max_seq_len: 61  # train-split p99 (longest case: 185)
  condition_features:
    - case:label
  attribute_features:
    - DiagnosticArtAstrup
    - DiagnosticBlood
    - DiagnosticECG
    - DiagnosticIC
    - DiagnosticLacticAcid
    - DiagnosticLiquor
    - DiagnosticSputum
    - DiagnosticUrinaryCulture
    - DiagnosticUrinarySediment
    - DiagnosticXthorax
    - DisfuncOrg
    - Hypotensie
    - Hypoxie
    - InfectionSuspected
    - Infusion
    - Oligurie
    - SIRSCritHeartRate
    - SIRSCritLeucos
    - SIRSCritTachypnea
    - SIRSCritTemperature
    - SIRSCriteria2OrMore
    - Age
    - CRP
    - LacticAcid
    - Leucocytes
  time_clip_percentile: 99.0
  batch_size: 256
  # Kept at 256: the per-step decoder is launch-bound, so a smaller batch buys gradient noise
  # at a disproportionate cost in wall clock on mps.
  num_workers: 0

model:
  embeddings:
    activity_dim: 16  # 16 activities: 32 dimensions were more than the alphabet can fill
    resource_dim: 12  # 25 resources, and half of a resource's mass sits in a few of them

  # Both encoders shrink, but not equally. The prefix summary conditions the prior and the
  # decoder and is read at every step, so it keeps the most. The suffix encoder exists only
  # to give the posterior something to encode on the training path, and its capacity is
  # exactly what lets the posterior smuggle a whole suffix into z.
  prefix_encoder:
    hidden_dim: 96  # per direction: the summary is twice this wide
    num_layers: 1
    dropout: 0.2

  suffix_encoder:
    hidden_dim: 64
    num_layers: 1
    dropout: 0.2

  prior:
    hidden_dims: [96]
    dropout: 0.2

  latent:
    latent_dim: 16  # z only has to carry what the prefix does not already imply

  attention:
    dim: 96
    # Dropout here deletes attention weights, which denies a step a position it wanted to
    # read. That is a much blunter instrument than dropping a unit, so it stays low.
    dropout: 0.1

  decoder:
    hidden_dim: 96
    num_layers: 1
    # The heaviest of the three: this dropout is applied to the LSTM input at every step and
    # again in the trunk shared by the output heads, which is where memorization of the
    # train suffixes would live.
    dropout: 0.25
    head_hidden_dim: 64

optimizer:
  lr: 0.0003
  weight_decay: 0.0001  # 0.0 in the baseline; the smallest lever with a real effect here

loss:
  # The baseline fits 8 cycles into 1250 epochs at ratio 0.5, so the first full-weight epoch
  # is 80: the model had been overfitting for 50 epochs before early stopping and best-model
  # selection were allowed to look at anything. Four cycles over 400 epochs at ratio 0.3
  # makes each cycle 100 epochs, ramping for 30 and holding for 70, so the first comparable
  # epoch is 31 and each cycle leaves a long stretch of them.
  kl_annealing_cycles: 4
  kl_annealing_ratio: 0.3
  kl_annealing_start_weight: 0.0
  kl_annealing_full_weight: 1.0

training:
  # 400 epochs at the baseline's ~39 s/epoch is about 4 hours, and early stopping can now bite
  # from epoch 31, so a run that overfits is cut short instead of grinding to the limit. The
  # baseline's 1250 epochs were ~13.5 hours.
  max_num_epochs: 400

early_stopping:
  # Must stay below one full-weight stretch (70 epochs), since the counter resets whenever
  # the weight drops at the start of a cycle.
  patience: 30
  min_delta_perc: 0.0
