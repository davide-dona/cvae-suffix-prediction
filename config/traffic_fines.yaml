data:
  dir: data/traffic_fines

  case_key: "Case ID"
  activity_key: Activity
  resource_key: Resource
  timestamp_key: "time:timestamp"
  label_key: label

  train_split: 0.65
  val_split: 0.15
  test_split: 0.2
  max_seq_len: 20  # longest case in the log, so nothing is ever truncated
  condition_features:
    - case:label
  attribute_features:
    - vehicleClass
    - amount
    - points
    - lastSent
    - notificationType
    - dismissal
    - expense
  time_clip_percentile: 99.0
  batch_size: 256
  num_workers: 4

training:
  max_num_epochs: 7600  # 84249 train traces, cut into 221016 prefix/suffix pairs
