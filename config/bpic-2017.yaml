data:
  case_key: "case:concept:name"
  activity_key: "concept:name"
  resource_key: "org:resource"
  timestamp_key: "time:timestamp"

  train_split: 0.65
  val_split: 0.15
  test_split: 0.2
  split_strategy: temporal
  max_seq_len_percentile: 98.5  # the cut both baselines make

  event_features:
    # Case-level: share the same value for every row in a case
    - case:LoanGoal
    - case:ApplicationType
    - case:RequestedAmount
    # Event-level: vary per row in a case
    - Action
    - EventOrigin
    - lifecycle:transition
    - FirstWithdrawalAmount
    - NumberOfTerms
    - Accepted
    - MonthlyCost
    - Selected
    - CreditScore
    - OfferedAmount
    # Calendar position of the event
    - day_in_week
    - seconds_in_day

  # Every numeric channel is standardized raw, as both baselines do: SuTraN runs with
  # `log_transformed = False`, U-ED-LSTM with an empty `num_dyn_log`.
  log_scaled_features: []
  log_scaled_durations: false
  batch_size: 256
  num_workers: 0

# Widest, longest-sequence, richest-vocab log in the suite; scaled up from base.yaml.
model:
  d_model: 128
  embeddings:
    resource_dim: 32  # 149 resources vs base's 25-50
  prefix_encoder:
    feedforward_dim: 512  # keep the 4x d_model ratio
  suffix_encoder:
    num_layers: 2  # base's 1 layer summarizes suffixes up to 95 events, not just ~40
    feedforward_dim: 512
  prior:
    hidden_dims: [128]
  decoder:
    feedforward_dim: 512
    head_hidden_dim: 128
