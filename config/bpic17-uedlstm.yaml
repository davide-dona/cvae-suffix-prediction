# BPIC17 as U-ED-LSTM sees it: their split, their feature set
data:
  case_key: "case:concept:name"
  activity_key: "concept:name"
  resource_key: "org:resource"
  timestamp_key: "time:timestamp"

  # Their `train_validation_size` (0.15) is the validation set despite its name, and
  # `test_validation_size` (0.2) the test set; train is whatever is left.
  train_split: 0.65
  val_split: 0.15
  test_split: 0.2
  split_strategy: uedlstm_replicated
  max_seq_len_percentile: 98.5  # as in `bpic17.yaml`

  # Their v1 BPIC17 loader notebook's lists, minus `concept:name` and `org:resource`, which are
  # the activity and resource channels here. v1, not v2, because v1 is what the paper reports
  # and what `training_variational_dropout/BPIC17/BPIC_2017_full_grad_norm_4layer.pkl` was
  # trained on; v2 drops `Action` and `EventOrigin`, which v1 and that checkpoint's own
  # `enc_feat` both carry. `OfferedAmount`, `OfferID` and `EventID` are in neither.
  event_features:
    - Action
    - EventOrigin
    - case:LoanGoal
    - case:ApplicationType
    - Accepted
    - Selected
    - lifecycle:transition
    - case:RequestedAmount
    - FirstWithdrawalAmount
    - NumberOfTerms
    - MonthlyCost
    - CreditScore
    - day_in_week
    - seconds_in_day

  # Their `num_dyn_log` is empty, so every numeric channel is standardized raw.
  log_scaled_features: []
  log_scaled_durations: false
  batch_size: 256
  num_workers: 0
