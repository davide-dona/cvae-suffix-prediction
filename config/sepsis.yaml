data:
  case_key: "Case ID"
  activity_key: Activity
  resource_key: Resource
  timestamp_key: "time:timestamp"

  train_split: 0.65
  val_split: 0.15
  test_split: 0.2
  split_strategy: temporal
  max_seq_len_percentile: 98.5  # the cut both baselines make

  event_features:
    - DiagnosticArtAstrup
    - DiagnosticBlood
    - DiagnosticECG
    - DiagnosticIC
    - DiagnosticLacticAcid
    - DiagnosticLiquor
    - DiagnosticSputum
    - DiagnosticUrinaryCulture
    - DiagnosticUrinarySediment
    - DiagnosticXthorax
    - DisfuncOrg
    - Hypotensie
    - Hypoxie
    - InfectionSuspected
    - Infusion
    - Oligurie
    - SIRSCritHeartRate
    - SIRSCritLeucos
    - SIRSCritTachypnea
    - SIRSCritTemperature
    - SIRSCriteria2OrMore
    - Age
    - CRP
    - LacticAcid
    - Leucocytes
    # Calendar position of the event
    - day_in_week
    - seconds_in_day

  # Every numeric channel is standardized raw, as both baselines do: SuTraN runs with
  # `log_transformed = False`, U-ED-LSTM with an empty `num_dyn_log`.
  log_scaled_features: []
  log_scaled_durations: false
  batch_size: 256
  num_workers: 0  # 0, not 4: macOS spawn overhead measured 2.1x slower end to end

# Narrower, shorter-sequence, smaller-vocab log than bpic; scaled down from base.yaml.
model:
  d_model: 64
  embeddings:
    resource_dim: 16  # far fewer resources than bpic17's 149
    # 21 ternary channels (TRUE/FALSE/missing). At base's 8 they would be 168 of the 209 inputs
    # the projection reads, leaving the activity 16 of them.
    feature_dim: 4
  prefix_encoder:
    feedforward_dim: 256  # keep the 4x d_model ratio
  suffix_encoder:
    num_layers: 1  # suffixes run up to ~40 events here, not bpic17's 95
    feedforward_dim: 256
  prior:
    hidden_dims: [64]
  decoder:
    feedforward_dim: 256
    head_hidden_dim: 64
