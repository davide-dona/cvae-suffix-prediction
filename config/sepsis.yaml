data:
  case_key: "Case ID"
  activity_key: Activity
  resource_key: Resource
  timestamp_key: "time:timestamp"

  train_split: 0.65
  val_split: 0.15
  test_split: 0.2
  split_strategy: temporal
  max_seq_len_percentile: 98.5  # the cut both baselines make

  event_features:
    - DiagnosticArtAstrup
    - DiagnosticBlood
    - DiagnosticECG
    - DiagnosticIC
    - DiagnosticLacticAcid
    - DiagnosticLiquor
    - DiagnosticSputum
    - DiagnosticUrinaryCulture
    - DiagnosticUrinarySediment
    - DiagnosticXthorax
    - DisfuncOrg
    - Hypotensie
    - Hypoxie
    - InfectionSuspected
    - Infusion
    - Oligurie
    - SIRSCritHeartRate
    - SIRSCritLeucos
    - SIRSCritTachypnea
    - SIRSCritTemperature
    - SIRSCriteria2OrMore
    - Age
    - CRP
    - LacticAcid
    - Leucocytes
    # Calendar position of the event, bounded so both scale linearly
    - day_in_week
    - seconds_in_day

  # The three blood measurements, whose long tail a log spreads. Age is bounded, and a log skews
  # it rather than spreading it.
  log_scaled_features:
    - CRP
    - LacticAcid
    - Leucocytes
  log_scaled_durations: true
  numeric_clip_percentile: 99.0
  batch_size: 256
  num_workers: 0  # 0, not 4: macOS spawn overhead measured 2.1x slower end to end

model:
  embeddings:
    # 21 ternary channels (TRUE/FALSE/missing). At base's 8 they would be 168 of the 209 inputs
    # the projection reads, leaving the activity 16 of them.
    feature_dim: 4
