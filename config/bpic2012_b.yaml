data:
  dir: data/bpic2012_b

  case_key: "Case ID"
  activity_key: Activity
  resource_key: Resource
  timestamp_key: "time:timestamp"
  label_key: label

  train_split: 0.65
  val_split: 0.15
  test_split: 0.2
  max_seq_len: 112  # train-split p99 (longest case: 175)
  condition_features:
    - case:label
  attribute_features:
    - AMOUNT_REQ
    - "lifecycle:transition"
  time_clip_percentile: 99.0
  batch_size: 64
  num_workers: 4
