data:
  dir: data/bpic2012_b

  case_key: "Case ID"
  activity_key: Activity
  resource_key: Resource
  timestamp_key: "time:timestamp"
  label_key: label

  train_split: 0.65
  val_split: 0.15
  test_split: 0.2
  max_seq_len: 112  # train-split p99 (longest case: 175)
  condition_features:
    - case:label
  attribute_features:
    - AMOUNT_REQ
    - "lifecycle:transition"
  time_clip_percentile: 99.0
  batch_size: 256
  # 0, not 4: `__getitem__` only slices arrays the codec already decoded, so a worker has
  # nothing to overlap with the GPU, and macOS spawns rather than forks - every epoch pays
  # four fresh torch imports per loader. Measured at 2.1x slower end to end than 0.
  num_workers: 0

training:
  max_num_epochs: 500  # 3045 train traces, cut into 119073 prefix/suffix pairs

early_stopping:
  patience: 20  # full-weight stretches are 31 epochs long at this budget
