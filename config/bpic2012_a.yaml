data:
  dir: data/bpic2012_a

  case_key: "Case ID"
  activity_key: Activity
  resource_key: Resource
  timestamp_key: "time:timestamp"
  label_key: label

  train_split: 0.65
  val_split: 0.15
  test_split: 0.2
  max_seq_len: 112  # train-split p99 (longest case: 175)
  condition_features:
    - case:label
  attribute_features:
    - AMOUNT_REQ
    - "lifecycle:transition"
  time_clip_percentile: 99.0
  batch_size: 256
  num_workers: 4

training:
  max_num_epochs: 500  # 3045 train traces, cut into 119073 prefix/suffix pairs

early_stopping:
  patience: 20  # full-weight stretches are 31 epochs long at this budget
