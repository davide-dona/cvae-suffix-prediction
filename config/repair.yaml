data:
  case_key: "case:concept:name"
  activity_key: "concept:name"
  resource_key: "org:resource"
  timestamp_key: "time:timestamp"
  label_key: "N/A"  # no case label in this log; rename target that does not exist, so a no-op

  train_split: 0.65
  val_split: 0.15
  test_split: 0.2
  max_seq_len: 15  # train-split p99, equal to the longest case: traces are capped at 15
  event_features: []  # a:id and type carry no usable information; nothing else to list
  time_clip_percentile: 99.0
  batch_size: 256
  num_workers: 0
